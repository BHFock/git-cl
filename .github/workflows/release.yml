name: Release
on:
  push:
    tags: ['*.*.*']
  workflow_dispatch:        # manual run: publishes to TestPyPI only
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Check that the tag matches the version
        if: github.event_name == 'push'
        run: |
          grep -qx "version = ${GITHUB_REF_NAME}" setup.cfg
          grep -qx "__version__ = \"${GITHUB_REF_NAME}\"" git-cl
          grep -qx "version: ${GITHUB_REF_NAME}" CITATION.cff
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi              # waits for your approval
      url: https://pypi.org/p/git-changelists
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/